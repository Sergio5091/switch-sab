services:
  # ─── Backend Node.js ─────────────────────────────────────────────────────────
  - type: web
    name: switch-sab-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: switch-sab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # à renseigner manuellement après déploiement Vercel
      - key: LICENCE_PRIVATE_KEY_PATH
        value: ./keys/private-key.pem
      - key: LICENCE_PUBLIC_KEY_PATH
        value: ./keys/public-key.pem

databases:
  # ─── PostgreSQL managé par Render ────────────────────────────────────────────
  - name: switch-sab-db
    databaseName: switchsab
    user: switchsab_user
    plan: free
